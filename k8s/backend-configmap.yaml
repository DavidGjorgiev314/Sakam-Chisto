apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: sakamchisto
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: sakamchisto
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sakamchisto
  UPLOADS_DIR: /app/uploads
  CORS_ALLOWED_ORIGINS: http://sakamchisto.local
  JPA_SHOW_SQL: "false"
