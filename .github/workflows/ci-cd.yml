name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sakamchisto-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sakamchisto-frontend

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sakamchisto
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        working-directory: backend
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render kustomization
        run: kubectl kustomize k8s > /dev/null

  publish:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [backend, frontend, manifests]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ github.sha }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ github.sha }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          $ErrorActionPreference = 'Continue'
          $dir = Join-Path $env:RUNNER_TEMP 'kube'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $path = Join-Path $dir 'config'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String('${{ secrets.KUBE_CONFIG }}'))
          Add-Content -Path $env:GITHUB_ENV -Value "KUBECONFIG=$path"
          Write-Host "Kubeconfig written to $path"

      - name: Apply manifests
        run: |
          $ErrorActionPreference = 'Continue'
          kubectl apply -f k8s/namespace.yaml
          if ($LASTEXITCODE -ne 0) { throw 'failed to apply namespace' }
          kubectl apply -k k8s
          if ($LASTEXITCODE -ne 0) { throw 'failed to apply kustomization' }

      - name: Roll out new image versions
        run: |
          $ErrorActionPreference = 'Continue'
          kubectl -n sakamchisto set image deployment/backend backend=${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { throw 'failed to update backend image' }
          kubectl -n sakamchisto set image deployment/frontend frontend=${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { throw 'failed to update frontend image' }

      - name: Wait for rollout
        run: |
          $ErrorActionPreference = 'Continue'
          kubectl -n sakamchisto rollout status deployment/backend --timeout=300s
          if ($LASTEXITCODE -ne 0) { throw 'backend rollout did not complete' }
          kubectl -n sakamchisto rollout status deployment/frontend --timeout=300s
          if ($LASTEXITCODE -ne 0) { throw 'frontend rollout did not complete' }

      - name: Report cluster state
        if: always()
        run: kubectl -n sakamchisto get pods,service,ingress
